[mypy]
python_version = 3.14
strict = True
ignore_missing_imports = True
no_namespace_packages = True
warn_unused_ignores = True
mypy_path = .

# Home Assistant base classes are typed as Any when stubs are absent.
# warn_unused_ignores = False suppresses the cascade of "unused type: ignore"
# errors that result from @callback and HA base-class decorators being untyped.
# Module names are resolved as "chargy.*" because custom_components/ is a
# namespace package (no __init__.py, as required by Home Assistant).
# See ADR-0000 §2 for the full rationale behind this per-file suppression
# approach (never a global disable_error_code), and ADR-0001 §3 for
# Chargy's own module layout these entries track.
[mypy-chargy.config_flow]
warn_unused_ignores = False

[mypy-chargy.sensor]
warn_unused_ignores = False

[mypy-chargy.coordinator]
warn_unused_ignores = False
