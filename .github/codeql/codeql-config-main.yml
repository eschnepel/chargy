name: "Chargy CodeQL config — main"

# Everything except tests/, which has its own job/config
# (codeql-config-tests.yml) so each surface can carry its own
# query-filters without one excluding alerts the other should still
# catch. `py/ineffectual-statement` is excluded here but not there.
paths-ignore:
  - tests

query-filters:
  - exclude:
      id: py/ineffectual-statement
